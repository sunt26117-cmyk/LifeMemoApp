
name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取完整源码
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. 设置 Node.js 环境（Capacitor 必须）
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

# 3. 设置 Java 环境（改为 21）
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 4. 安装前端依赖并构建静态网页资源
      - name: Install Node Dependencies & Build Web Assets
        run: |
          npm install
          npm run build --if-present

     # 5. 同步前端资源到安卓工程
      - name: Sync Capacitor Android
        run: npx cap sync android

      # 5.5 确保统一固定签名证书存在（解决安装包与上一版签名冲突问题）
      - name: Ensure Fixed Signing Keystore Exists
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            echo "Creating fixed debug keystore..."
            keytool -genkey -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "Keystore verified."

      # 6. 赋予 gradlew 执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # 7. 进入 android 目录执行打包（传递运行编号以自增版本号）
      - name: Build Android with Gradle
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          cd android
          ./gradlew assembleDebug

      # 8. 收集生成的 APK 供下载
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
